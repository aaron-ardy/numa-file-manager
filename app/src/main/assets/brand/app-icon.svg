<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark App Canvas Background -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1C29"/>
      <stop offset="100%" stop-color="#0E0F17"/>
    </linearGradient>

    <!-- Folder Back Plate (Amber Dark) -->
    <linearGradient id="amber-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Folder Front Flap (Amber Light) -->
    <linearGradient id="amber-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Tag Accent (Ocean Palette) -->
    <linearGradient id="ocean-tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="numa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF6D00" flood-opacity="0.35"/>
    </filter>

    <!-- Ambient Shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Radial Background Flare -->
  <circle cx="256" cy="256" r="130" fill="#FF9233" opacity="0.12" style="filter: blur(36px);"/>

  <!-- 1. UNIFIED FOLDER BACK PLATE (Connected Tab + Body) -->
  <path d="M 112 180 
           C 112 166.7, 122.7 156, 136 156 
           L 204 156 
           C 214 156, 222 161, 228 168 
           L 242 184 
           L 376 184 
           C 389.3 184, 400 194.7, 400 208 
           L 400 348 
           C 400 361.3, 389.3 372, 376 372 
           L 136 372 
           C 122.7 372, 112 361.3, 112 348 
           Z" 
        fill="url(#amber-back)" 
        filter="url(#soft-shadow)"/>

  <!-- 2. PEEKING DOCUMENT SHEET -->
  <g filter="url(#soft-shadow)">
    <rect x="160" y="152" width="192" height="150" rx="12" fill="#FFFFFF"/>
    <rect x="184" y="176" width="72" height="8" rx="4" fill="#0072FF"/>
    <rect x="184" y="194" width="144" height="6" rx="3" fill="#E0E6ED"/>
    <rect x="184" y="208" width="110" height="6" rx="3" fill="#E0E6ED"/>
  </g>

  <!-- 3. FOLDER FRONT FLAP -->
  <g filter="url(#numa-glow)">
    <rect x="112" y="208" width="288" height="164" rx="24" fill="url(#amber-front)"/>
  </g>

  <!-- 4. NUMA SPARKLE (Center Star Accent) -->
  <path d="M 256 265 
           C 256 278, 262 284, 275 284 
           C 262 284, 256 290, 256 303 
           C 256 290, 250 284, 237 284 
           C 250 284, 256 278, 256 265 Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>

  <!-- 5. OCEAN TAG (Custom File Tag Badge) -->
  <g transform="translate(320, 260) rotate(-18)" filter="url(#soft-shadow)">
    <path d="M 8 16 
             C 8 11.6, 11.6 8, 16 8 
             L 44 8 
             C 46.8 8, 49.4 9.2, 51.3 11.3 
             L 81.3 43.3 
             C 85.2 47.2, 85.2 53.5, 81.3 57.4 
             L 57.4 81.3 
             C 53.5 85.2, 47.2 85.2, 43.3 81.3 
             L 11.3 49.3 
             C 9.2 47.4, 8 44.8, 8 42 Z" 
          fill="url(#ocean-tag)"/>
    <circle cx="24" cy="24" r="6" fill="#1A1C29"/>
  </g>
</svg>
